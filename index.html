<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Keylogger</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #fff; color: #000; }
        
        /* Invisible Overlay */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 99999; background: transparent;
        }

        /* Button */
        #viewBtn {
            position: fixed; bottom: 20px; right: 20px;
            padding: 15px 30px; background: #007bff; color: white;
            border: none; cursor: pointer; font-size: 16px; z-index: 100000;
        }
        #viewBtn:hover { background: #0056b3; }

        /* Log Window */
        #logWindow {
            display: none; /* Hidden by default */
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; max-height: 80vh; overflow-y: auto;
            background: #f9f9f9; border: 2px solid #333;
            padding: 20px; z-index: 100001; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        .log-line { margin: 2px 0; font-family: monospace; word-wrap: break-word; }
        .close-btn { float: right; cursor: pointer; font-weight: bold; color: red; }
    </style>
</head>
<body>

    <!-- Overlay catches events -->
    <div id="overlay"></div>

    <!-- Dummy Content -->
    <h1>Login Simulation</h1>
    <input type="text" placeholder="Username" style="padding:10px; margin-bottom:10px;">
    <input type="password" placeholder="Password" style="padding:10px; margin-bottom:10px;">
    
    <button id="viewBtn">View Logs</button>

    <!-- Log Container -->
    <div id="logWindow">
        <span class="close-btn" onclick="document.getElementById('logWindow').style.display='none'">X</span>
        <h2>Captured Keystrokes</h2>
        <div id="logsOutput"></div>
    </div>

    <script>
        const logData = [];
        const viewBtn = document.getElementById('viewBtn');
        const logWindow = document.getElementById('logWindow');
        const logsOutput = document.getElementById('logsOutput');

        // 1. Save to LocalStorage
        function saveLogs() {
            try {
                localStorage.setItem('bz_logs', JSON.stringify(logData));
                console.log("Logs Saved:", logData.length, "items"); // Debug
            } catch (e) {
                console.error("Storage Error:", e);
            }
        }

        // 2. Load and Display Logs
        function showLogs() {
            console.log("Attempting to load logs..."); // Debug
            let stored = localStorage.getItem('bz_logs');
            
            if (!stored) {
                logsOutput.innerHTML = "<p>No logs found yet. Type something first!</p>";
            } else {
                try {
                    const parsed = JSON.parse(stored);
                    logsOutput.innerHTML = parsed.map(line => 
                        `<div class="log-line">${escapeHtml(line)}</div>`
                    ).join('');
                } catch (e) {
                    logsOutput.innerHTML = "<p>Error parsing logs.</p>";
                    console.error("Parse Error", e);
                }
            }
            logWindow.style.display = 'block';
            console.log("Log window opened."); // Debug
        }

        // Helper to prevent HTML injection
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // 3. Capture Keys
        document.addEventListener('keydown', function(e) {
            const key = e.key;
            let logKey = key;

            // Map special keys
            if (key === ' ') logKey = '[SPACE]';
            else if (key === 'Enter') logKey = '[ENTER]';
            else if (key === 'Backspace') logKey = '[BS]';
            else if (key === 'Tab') logKey = '[TAB]';
            else if (key === 'CapsLock') logKey = '[CAPS]';
            else if (key === 'Shift') logKey = '[SHIFT]';
            else if (key === 'Control') logKey = '[CTRL]';
            else if (key === 'Alt') logKey = '[ALT]';
            else if (key === 'Escape') logKey = '[ESC]';
            else if (key === 'Delete') logKey = '[DEL]';
            
            // Ignore modifier keys pressed alone
            if (['Shift', 'Control', 'Alt', 'CapsLock'].includes(key) && !e.ctrlKey && !e.altKey && !e.metaKey) {
                return; 
            }

            logData.push(logKey);
            
            // Limit size
            if (logData.length > 5000) logData.shift();

            saveLogs();
        });

        // 4. Event Listeners
        viewBtn.addEventListener('click', showLogs);

        // Initial check on load
        console.log("Script Loaded. Waiting for input...");
    </script>
</body>
</html>
